name: Deploy PLFH to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.14.1.1"

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.12.2-hakyll-${{ hashFiles('plfh-site.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.12.2-hakyll-

      - name: Build Hakyll site generator
        run: |
          for attempt in 1 2 3; do
            cabal update && break
            echo "cabal update attempt $attempt failed, retrying..."
            sleep 5
          done
          cabal build plfh-site

      - name: Generate static book site
        env:
          PLFH_BASEURL: /PLFH
          PLFH_WASM_ROOTFS_URL: ${{ vars.PLFH_WASM_ROOTFS_URL }}
        run: |
          cabal run plfh-site -- rebuild

      - name: Fetch published Wasm GHC rootfs (same-origin fallback)
        if: ${{ vars.PLFH_WASM_ROOTFS_URL == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site/wasm
          if gh release download wasm-latest --pattern 'rootfs.tar.gz' --dir _site/wasm --clobber 2>/dev/null; then
            ls -lh _site/wasm/rootfs.tar.gz
          else
            echo "No wasm-latest release asset found yet; deploying interactive UI without rootfs.tar.gz."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
